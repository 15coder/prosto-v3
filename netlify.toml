[build]
  base    = "."
  command = "pnpm install && pnpm --filter @workspace/prosto run build"
  publish = "artifacts/prosto/dist/public"
  functions = "netlify/functions"

[build.environment]
  BASE_PATH = "/"
  PORT      = "3000"
  NODE_ENV  = "production"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
